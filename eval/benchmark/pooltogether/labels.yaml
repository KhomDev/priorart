# Labels for the second priorart public benchmark corpus
# (eval/benchmark/pooltogether/manifest.yaml).
#
# Store pointers and labels only; never a finding body.
#
# label values
#   known_prior    the judge excluded the finding AND the text repeats the claim
#                  of one specific prior item; prior_ref names it.
#   invalid_unmapped the judge excluded the finding but no prior item reproduces
#                  its claim. This is not a claim that the finding is wrong; it
#                  is the absence of a prior-item grounding.
#   unique_valid   judged paid Medium/High and not a judge-grouped duplicate
#                  (platform label, applied to every accepted directory).
#
# method: reader (a person/AI read the text, 2026-11-24) or platform (the
# judge's own label). confidence: high | medium | low. See BENCHMARK.md for the
# label design, the dead ends and the agreement check.
#
# The prior audit is Code4rena 2024-03 (9 High/Medium report items plus the
# sponsor's one known issue). A C4 report item is a prior item by definition of
# the generated manifest; M-03's report comment records the judge downgrading
# it to Low, but the report still lists it under Medium Risk Findings, so it
# stays in the prior-item set and the note is recorded on inv:009.
version: 1
schema: priorart.benchmark.labels/v1
seed: "priorart-bench-pooltogether-2026-11-24"
reader: "bench-eval (one AI reader, 2026-11-24); not ground truth, see BENCHMARK.md"

