# Labels for the priorart public benchmark (eval/benchmark/manifest.yaml).
#
# Store pointers and labels only; never a finding body.
#
# label values
#   known_prior    the judge excluded the finding AND the text repeats the claim
#                  of one specific prior item; prior_ref names it.
#   invalid_unmapped the judge excluded the finding but no prior item reproduces
#                  its claim. This is not a claim that the finding is wrong; it
#                  is the absence of a prior-item grounding.
#   unique_valid   judged paid Medium/High and not a duplicate (platform label,
#                  applied to every accepted directory; no reader involved).
#
# method: reader (a person/AI read the text, 2026-11-12) or platform (the
# judge's own label). confidence: high | medium | low. See BENCHMARK.md for the
# rubric, the dead ends that forced this label design, and the agreement check.
version: 1
schema: priorart.benchmark.labels/v1
seed: "priorart-bench-2026-11-12"
reader: "bench-eval (one AI reader, 2026-11-12); not ground truth, see BENCHMARK.md"

findings:
