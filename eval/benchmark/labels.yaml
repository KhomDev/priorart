    label: known_prior
    prior_ref: ki-2024-02:1
    method: reader
    confidence: medium
    provenance: "invalid/001.md is about a zero-address check; the contest README known-issue answer is KI-1 Zero address check"
    notes: "the finding claims the zero-address check is bypassable, which is broader than KI-1; a judge could also have excluded it as a quality call. Kept as the only positive and reported alone, not as a rate."
