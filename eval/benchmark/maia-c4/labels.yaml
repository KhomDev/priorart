# Labels for the Code4rena-judged corpus eval/benchmark/maia-c4/manifest.yaml.
#
# Store pointers and labels only; never a finding body.
#
# The paid findings carry the platform label unique_valid (the manifest
# applies it). Excluded findings are labelled only on the preregistered
# seeded sample: the 20 with the smallest sha256(seed + ':label:' + id).
# Every other excluded finding is unlabelled and is not a known-prior query.
#
# label values: known_prior (the judge excluded it AND its text repeats one
# specific prior item's claim; prior_ref names it) or invalid_unmapped (no
# prior item reproduces its claim). Rubric as for the PoolTogether corpus.
#
# method: reader (one AI reader, full text, 2026-11-25). See BENCHMARK.md.
