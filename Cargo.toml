[package]
name = "priorart"
version = "0.1.0"
edition = "2021"
description = "Offline, deterministic prior-art dossiers for smart-contract audit findings: has this been found, is it excluded, and can it be paid?"
license = "MIT"
repository = "https://github.com/KhomDev/priorart"
homepage = "https://github.com/KhomDev/priorart"
keywords = ["bug-bounty", "smart-contract", "audit", "prior-art", "triage"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.89"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
