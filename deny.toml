# cargo-deny configuration.
#
# The dependency graph was small until PA-B1 added `solar-parse 0.2.0` (the
# Solidity parser): six direct crates, 322 packages total. Every addition is a
# supply-chain decision, so the checks below stay strict; the exceptions the
# parser forced are listed individually with a reason rather than by relaxing a
# whole class of check.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained (archived, no known
    # vulnerability). It is transitive through solar-parse 0.2.0; solar has no
    # release without it. Listed with its reason so the exception is visible;
    # remove it when solar drops the dependency.
    { id = "RUSTSEC-2024-0436", reason = "transitive through solar-parse 0.2.0; unmaintained, no known vulnerability, no upstream fix" },
    # RUSTSEC-2026-0387: timing variability in crypto-bigint 0.5.5 on secret
    # integers, transitive through solar -> alloy -> k256 -> elliptic-curve;
    # the parent requires ^0.5, so the patched 0.7 is not selectable. priorart
    # performs no secret-key operation, so the affected paths are unreachable
    # with secret material. Also recorded in .cargo/audit.toml.
    { id = "RUSTSEC-2026-0387", reason = "transitive k256/elliptic-curve requires crypto-bigint ^0.5; priorart performs no secret-key operation" },
]
# Deny on any advisory with a known fix. An advisory with no fix is reported but
# does not block, because blocking on it would mean blocking on upstream.
yanked = "deny"

[licenses]
version = 2
# Everything in the graph resolves to one of these. If a new dependency arrives
# under a different licence, that is a decision to make explicitly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The no-network property is a hard guarantee, not a preference. See
# docs/no-network.md. This list is the manifest-level half of the check; CI also
# greps the resolved graph, because a transitive arrival is the likelier route.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "native-tls" },
    { name = "rustls" },
    { name = "openssl" },
    { name = "tungstenite" },
]
# Transitive duplicates introduced by solar-parse 0.2.0. Each pair cannot be
# collapsed without an upstream release; the exact older versions are skipped,
# so the exception names what it permits rather than disabling the check.
skip = [
    { name = "cpufeatures", version = "=0.2.17" },
    { name = "hashbrown", version = "=0.14.5" },
    { name = "syn", version = "=2.0.119" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
