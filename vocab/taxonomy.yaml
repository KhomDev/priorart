# Mechanism and impact taxonomy - the closed vocabulary for
# `priorart taxonomy classify`.
#
# A finding says WHAT is wrong (a root cause), WHAT it costs (an impact) and
# WHICH asset is involved. Programs word these three things differently
# everywhere and mean one of about twenty root causes, five impacts and five
# asset classes. This file is DATA: classes only, in industry-standard wording,
# with no finding or program quoted and no program named.
#
# Extraction is deterministic and offline. A cue is a term or phrase matched
# case-insensitively on word boundaries. An anti-cue is the fix-side spelling of
# the same words ("reentrancy guard"): a cue occurrence inside an anti-cue span
# is ignored unless the anti-cue is itself described as missing or absent. A
# cue negated in its own clause ("no reentrancy risk", "prevents reentrancy")
# is ignored; a second, unnegated clause still asserts the class.
#
# A match is a prompt to read the finding, never a verdict.

