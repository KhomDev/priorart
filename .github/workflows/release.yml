name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts without creating a release
        type: boolean
        default: true

# A version tag (vX.Y.Z) builds every target, attests the archives and the SBOM,
# writes SHA256SUMS and publishes the GitHub release. Attestations are made on
# tag runs only: a dry run creates no attestation, and cannot, because it has no
# tag. Check an archive with `gh attestation verify` (docs/install.md).
#
# Run by hand (workflow_dispatch), dry_run (default true) builds the same
# archives and publishes nothing. The release step also requires a tag ref, so a
# dispatch on a branch can never create a release or a tag.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker for aarch64 linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          # A branch name with a slash would nest the archive in a folder that
          # the upload path does not match; a tag never has one.
          ref="${GITHUB_REF_NAME//\//-}"
          name="priorart-${ref}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/priorart" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '/', '-'
          $name = "priorart-$ref-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/priorart.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - name: Attest build provenance
        if: github.ref_type == 'tag' && !inputs.dry_run
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # This job's archive only: a zip exists on Windows, a tar.gz elsewhere.
          subject-path: dist/*.${{ matrix.archive }}
      - uses: actions/upload-artifact@v7
        with:
          name: priorart-${{ matrix.target }}
          # Only the archives: the unpacked directory is still in dist/ and
          # would otherwise be merged into the release download as a directory.
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The software bill of materials for the crate at this ref: every dependency
  # the build can use, in CycloneDX 1.5 JSON. One file, not one per target.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-cyclonedx@0.5.10
      - name: Generate the SBOM
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME//\//-}"
          # Without --override-filename the file is <crate>.cdx.json at the root.
          cargo cyclonedx --format json --spec-version 1.5
          test -s priorart.cdx.json
          mkdir -p dist
          mv priorart.cdx.json "dist/priorart-${ref}.cdx.json"
          ls -l dist
      - name: Attest the SBOM
        if: github.ref_type == 'tag' && !inputs.dry_run
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the asset set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          archives=(*.tar.gz *.zip)
          sboms=(*.cdx.json)
          # One archive per target in the build matrix, and one SBOM.
          test "${#archives[@]}" = 5 || { echo "::error::expected 5 archives, found ${#archives[@]}"; exit 1; }
          test "${#sboms[@]}" = 1 || { echo "::error::expected 1 SBOM, found ${#sboms[@]}"; exit 1; }
          # Plain names, so `sha256sum -c SHA256SUMS` works in the download folder.
          sha256sum "${archives[@]}" "${sboms[@]}" > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" = 6
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Literal regexes are not double-escaped: /^## \[/ is a bracket
          # expression, not an escaped bracket. Stop at the next release heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1}
            found && /^## \[/ && seen {exit}
            found {print; seen=1}
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - name: Publish
        # Tags only: a dispatch on a branch must never create a release or a tag.
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "priorart ${GITHUB_REF_NAME}" \
            --notes-file notes.md
