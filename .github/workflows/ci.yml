name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (no version tags)
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="./target/release/priorart"
          [ -x "$bin" ] || bin="./target/release/priorart.exe"
          "$bin" --version
          "$bin" rules
          "$bin" vocab list
          "$bin" build examples/dossier-demo
          "$bin" check examples/finding-demo.md --dossier examples/dossier-demo/dossier-demo.dossier
          "$bin" ledger validate examples/ledger.example.yaml
          "$bin" rejections summary
          "$bin" explain privileged_role

  msrv:
    name: msrv (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (no version tags)
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - run: cargo test --locked --release

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    # audit-check creates a check run for its result, which needs checks:write.
    # Job-level permissions replace the workflow-level `contents: read`.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  no-network:
    name: no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (no version tags)
        with:
          toolchain: 1.98.0
      # ureq is allowed only as the optional fetch client. Every other HTTP
      # stack is still banned, and no source file opens a socket itself.
      - name: No HTTP client except the fetch feature
        run: |
          set -euo pipefail
          for banned in reqwest hyper isahc curl surf attohttpc minreq awc tokio; do
            if grep -q "name = \"${banned}\"" Cargo.lock; then
              echo "HTTP stack in the lockfile: ${banned}" >&2
              exit 1
            fi
          done
          if ! grep -q 'name = "ureq"' Cargo.lock; then
            echo "ureq missing from Cargo.lock" >&2
            exit 1
          fi
      - name: No sockets in source
        run: |
          set -euo pipefail
          if grep -rn --include='*.rs' -E 'TcpStream|UdpSocket' src/; then
            echo "A source file opens a socket" >&2
            exit 1
          fi
          # The fetch client resolves names itself to refuse private addresses.
          if grep -rn --include='*.rs' -E 'std::net::' src/ | grep -v 'src/fetch/ureq_client.rs:'; then
            echo "std::net is named outside src/fetch/ureq_client.rs" >&2
            exit 1
          fi
          if grep -rn --include='*.rs' -E 'ureq::' src/ | grep -v 'src/fetch/ureq_client.rs:'; then
            echo "ureq is named outside src/fetch/ureq_client.rs" >&2
            exit 1
          fi
      - name: Default-off build has no HTTP crate
        run: |
          set -euo pipefail
          cargo tree --locked --no-default-features > /tmp/tree-offline.txt
          if grep -E 'ureq|reqwest|hyper|rustls|tokio|native-tls' /tmp/tree-offline.txt; then
            echo "HTTP crate in the --no-default-features tree" >&2
            exit 1
          fi
          cargo test --locked --no-default-features -j 2
          cargo build --locked --no-default-features -j 2
      - name: build, check, candidates, anchors and taxonomy do not use the network
        run: |
          set -euo pipefail
          cargo build --locked -j 2
          bin=./target/debug/priorart
          # A client that honoured the proxy environment would fail closed.
          export http_proxy=http://127.0.0.1:9
          export https_proxy=http://127.0.0.1:9
          export HTTP_PROXY=http://127.0.0.1:9
          export HTTPS_PROXY=http://127.0.0.1:9
          export ALL_PROXY=http://127.0.0.1:9
          export all_proxy=http://127.0.0.1:9
          "$bin" build examples/dossier-demo
          "$bin" check examples/finding-demo.md --dossier examples/dossier-demo/dossier-demo.dossier
          "$bin" candidates tests/fixtures/candidates/findings/finding-shared-function.md \
            --corpus tests/fixtures/candidates/corpus \
            --repo tests/fixtures/candidates-repo \
            --repo-id example/candidates-fixture \
            --commit 0000000000000000000000000000000000000000
          "$bin" anchors index tests/fixtures/anchors-repo
          "$bin" taxonomy classify tests/fixtures/taxonomy/finding-clean.md

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (no version tags)
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: README example is generated, not hand-copied
        run: bash scripts/regen-readme-examples.sh --check
      - name: Fixtures build and check
        run: |
          set -euo pipefail
          cargo build --locked
          ./target/debug/priorart build examples/dossier-demo
          ./target/debug/priorart check examples/finding-demo.md --dossier examples/dossier-demo/dossier-demo.dossier
          ./target/debug/priorart ledger validate examples/ledger.example.yaml examples/tier-shapes.example.yaml

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Relative links in markdown resolve
        run: python3 scripts/check_links.py

  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain with llvm-tools
        run: rustup toolchain install 1.98.0 --profile minimal --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0b45a05d6949463822299f3a2ec03d7ecec7c958 # cargo-binstall tag
        with:
          tool: cargo-llvm-cov

      - name: Measure
        shell: bash
        run: |
          set -eu
          cargo "+1.98.0" llvm-cov --locked --workspace --summary-only --no-cfg-coverage \
            | tee coverage.txt

      - name: Record the summary
        if: always()
        shell: bash
        run: |
          {
            echo "## cargo llvm-cov (1.98.0)"
            echo
            echo '```text'
            cat coverage.txt 2>/dev/null || echo "no coverage.txt was produced; see the step log"
            echo '```'
            echo
            echo "Not a gate. docs/test-quality.md is where the number is discussed."
          } >> "$GITHUB_STEP_SUMMARY"
