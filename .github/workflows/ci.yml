name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="./target/release/priorart"
          [ -x "$bin" ] || bin="./target/release/priorart.exe"
          "$bin" --version
          "$bin" rules
          "$bin" vocab list
          "$bin" build examples/dossier-demo
          "$bin" check examples/finding-demo.md --dossier examples/dossier-demo/dossier-demo.dossier
          "$bin" ledger validate examples/ledger.example.yaml
          "$bin" rejections summary
          "$bin" explain privileged_role

  msrv:
    name: msrv (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked --release

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  no network:
    name: no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The crate must stay offline: no HTTP client, no socket in src/.
      - name: No HTTP client in manifest or lockfile
        run: |
          set -euo pipefail
          for banned in reqwest ureq hyper isahc curl surf attohttpc minreq awc; do
            if grep -q "\b${banned}\b" Cargo.toml || grep -q "name = \"${banned}\"" Cargo.lock; then
              echo "HTTP client dependency found: ${banned}" >&2
              exit 1
            fi
          done
      - name: No sockets in source
        run: |
          set -euo pipefail
          if grep -rn --include='*.rs' -E 'TcpStream|UdpSocket|std::net::' src/; then
            echo "A source file opens a socket" >&2
            exit 1
          fi

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: README example is generated, not hand-copied
        run: bash scripts/regen-readme-examples.sh --check
      - name: Fixtures build and check
        run: |
          set -euo pipefail
          cargo build --locked
          ./target/debug/priorart build examples/dossier-demo
          ./target/debug/priorart check examples/finding-demo.md --dossier examples/dossier-demo/dossier-demo.dossier
          ./target/debug/priorart ledger validate examples/ledger.example.yaml examples/tier-shapes.example.yaml

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relative links in markdown resolve
        run: python3 scripts/check_links.py
