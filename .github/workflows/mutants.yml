# Weekly mutation testing, and a manual run on demand.
#
# This is not a pull-request gate. A surviving mutant is a behaviour no test
# pins down, and the point is to list it, not to fail a teammate's build. The
# measurement and the ten most important survivors are in docs/test-quality.md.

name: Mutants

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (no version tags)
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutate match, gates and dossier
        run: >-
          cargo mutants
          -f 'src/match/**/*.rs'
          -f 'src/gates/**/*.rs'
          -f 'src/dossier/**/*.rs'
          -j 5 --cargo-arg=--locked --timeout 300
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 90
