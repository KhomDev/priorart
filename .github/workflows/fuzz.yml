# Weekly fuzzing of every parser target, and a manual run on demand.
#
# The committed seeds replay through every target on each CI run
# (tests/fuzz_replay.rs). This workflow explores new inputs: five minutes per
# target weekly, and a 30-second smoke per target on every pull request and
# integration push. A crash fails its job and is uploaded.

name: Fuzz

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  # Short smoke (30 s per target) on every pull request and integration push;
  # the weekly schedule keeps the five-minute run.
  pull_request:
  push:
    branches: ["p2/integration"]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - markdown_import
          - pdf_scrape
          - html_normalize
          - program_yaml
          - known_issues_yaml
          - ledger_yaml
          - dossier_json
          - finding_profile
          - taxonomy
          - candidates_json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (no version tags)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }} (5 min weekly, 30 s smoke otherwise)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -timeout=10 -max_total_time=${{ github.event_name == 'schedule' && 300 || 30 }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
